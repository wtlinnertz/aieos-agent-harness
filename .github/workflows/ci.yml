name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows is not decoration. Running Linux-only hid two production defects
    # until the harness was first executed on Windows by hand (2026-07-15):
    #   G-6  -- text I/O without encoding= dies on cp1252 against UTF-8 kit files
    #   G-15 -- os.kill(pid, 0) is CTRL_C_EVENT on Windows, so the FR-019 lock's
    #           liveness probe fired a real Ctrl-C at the console process group
    # Both were invisible to a green Linux matrix. Do not drop the windows leg.
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/checkout v6.0.2 — aieos-schema, for the cross-repo Document
      # Control conformance integration tests (they skip when this is absent;
      # pytest testpaths=tests keeps this checkout out of collection)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: wtlinnertz/aieos-schema
          ref: main
          path: aieos-schema

      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # `slow` tests require real API keys; excluded here (pytest.ini also
        # deselects them by default).
        run: python -m pytest -m "not slow"
